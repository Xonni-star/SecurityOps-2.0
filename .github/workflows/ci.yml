name: SecurityOps 2.0 CI

# Vereinheitlichte Verifikation für Root-Projekt, Frontend (React/Vitest) und
# SecurityOps-Backend (Node/TypeScript, PostgreSQL 16 RLS).
#
# Benötigte Repository-Secrets:
#   JWT_SECRET               (Pflicht, >= 32 Zeichen, z. B. `openssl rand -hex 32`)
#   DATABASE_MIGRATION_URL   (optional, überschreibt die ephemere CI-Datenbank)
#   DATABASE_URL             (optional, überschreibt die ephemere CI-Datenbank)
#
# Ohne DATABASE_*-Secrets nutzen die Jobs den PostgreSQL-Service-Container
# mit ausschließlich lokaler Trust-Authentifizierung. Es sind keine
# Zugangsdaten im Workflow hinterlegt.

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root – npm ci, Strukturprüfung, Gesamtstart
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securityops_v2
          POSTGRES_USER: secops_admin
          # Nur innerhalb des ephemeren CI-Containers; keine Zugangsdaten nötig.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 8010
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL || 'postgresql://secops_admin@127.0.0.1:5432/securityops_v2' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://secops_app_user@127.0.0.1:5432/securityops_v2' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            frontend/backend/package-lock.json

      - name: Node-/npm-Version protokollieren
        run: node --version && npm --version

      - name: Root-Abhängigkeiten installieren
        run: npm ci

      - name: Root-Abhängigkeitsbaum ausgeben
        run: npm ls --depth=0

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci --prefix frontend

      - name: Backend-Abhängigkeiten installieren
        run: npm ci --prefix frontend/backend

      - name: Datenbankmigrationen (isolierte CI-Datenbank)
        run: npm run migrate --prefix frontend/backend

      - name: Testdaten anlegen
        run: npm run seed --prefix frontend/backend

      - name: Root-Struktur, Skriptziele und Proxy-Freiheit prüfen
        run: node scripts/ci/verify-root.mjs

      - name: Kontrollierter Gesamtstart (Frontend + Backend)
        run: node scripts/ci/smoke-start.mjs

  frontend:
    name: Frontend – npm ci, Vitest, Produktions-Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Node-/npm-Version protokollieren
        run: node --version && npm --version

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vitest-Tests ausführen
        run: npm test

      - name: Produktions-Build erzeugen
        run: npm run build

      - name: Frontend-Build auf verbliebene Modell-API-Verbindungen und Schlüssel prüfen
        run: |
          if grep -R -E 'generativelanguage\.googleapis\.com|aiplatform\.(googleapis|clients6)\.com|api\.openai\.com|process\.env\.(API_KEY|GEMINI_API_KEY)|AIza[0-9A-Za-z_-]{30,}' dist; then
            echo 'Modell-API-Endpunkt oder API-Schlüsselindikator im Frontend-Build gefunden.' >&2
            exit 1
          fi

      - name: Frontend-Build als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend – PostgreSQL 16, Migration, Build, Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securityops_v2
          POSTGRES_USER: secops_admin
          # Nur innerhalb des ephemeren CI-Containers; keine Zugangsdaten nötig.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL || 'postgresql://secops_admin@127.0.0.1:5432/securityops_v2' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://secops_app_user@127.0.0.1:5432/securityops_v2' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json

      - name: Node-/npm-Version protokollieren
        run: node --version && npm --version

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript-Build
        run: npm run build

      - name: Datenbankmigrationen (secops_admin)
        run: npm run migrate

      - name: Testdaten anlegen
        run: npm run seed

      - name: Migrationshistorie & Baseline (Integrationstests)
        run: npm test -- --runInBand --testPathPattern=migrations

      - name: Backend- und RLS-Integrationstests (Jest)
        run: npm test -- --runInBand

      - name: Backend-Build als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: frontend/backend/dist
          if-no-files-found: error
          retention-days: 7

  clamav-adapter-integration:
    name: ClamAV – DMS INSTREAM adapter integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    defaults:
      run:
        working-directory: frontend/backend

    services:
      clamav:
        image: clamav/clamav:1.4.3

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://integration:integration-only@localhost:5432/integration
      JWT_SECRET: integration-only-secret-not-for-production-0001
      CORS_ORIGIN: http://localhost:3000
      DMS_SCAN_REQUIRED: "true"
      DMS_SCANNER_PROVIDER: clamav
      DMS_CLAMAV_HOST: clamav
      DMS_CLAMAV_PORT: 3310
      DMS_CLAMAV_TIMEOUT_MS: 30000

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: DMS-ClamAV-INSTREAM-Integrationstest
        run: npm run test:clamav-integration

  dms-api-integration:
    name: DMS – PostgreSQL, private S3 and real ClamAV API flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: node:24-bookworm
    defaults:
      run:
        working-directory: frontend/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integration
          POSTGRES_USER: secops_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: ghcr.io/disaster37/minio@sha256:282ffcd2e0a3906086ab49cd70765617b20ce5c24ccf7d788043eb9b4ae59e6f
        env:
          MINIO_ROOT_USER: dms-integration-access
          MINIO_ROOT_PASSWORD: dms-integration-only-secret
        command: server /data --console-address :9001
      clamav:
        image: clamav/clamav:1.4.3

    env:
      NODE_ENV: test
      DATABASE_MIGRATION_URL: postgresql://secops_admin@postgres:5432/integration
      DATABASE_URL: postgresql://secops_app_user@postgres:5432/integration
      JWT_SECRET: dms-integration-only-secret-not-for-production-0001
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:3000
      DMS_SCAN_REQUIRED: "true"
      DMS_SCANNER_PROVIDER: clamav
      DMS_CLAMAV_HOST: clamav
      DMS_CLAMAV_PORT: 3310
      DMS_CLAMAV_TIMEOUT_MS: 30000
      DMS_S3_ENDPOINT: http://minio:9000
      DMS_S3_REGION: us-east-1
      DMS_S3_BUCKET: dms-api-integration
      DMS_S3_ACCESS_KEY: dms-integration-access
      DMS_S3_SECRET_KEY: dms-integration-only-secret
      DMS_S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Isolierte DMS-Datenbank migrieren und befüllen
        run: npm run migrate && npm run seed

      - name: Vollständigen DMS-API-Flow mit PostgreSQL, MinIO und ClamAV prüfen
        run: npm run test:dms-api-integration

  docker-production:
    name: Produktions-Docker – Konfiguration & Image-Builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Compose-Konfiguration validieren (ohne Secret-Interpolation)
        run: docker compose -f frontend/deploy/docker-compose.production.yml config --no-interpolate --quiet

      - name: Backend-Image bauen
        run: docker build -f frontend/deploy/Dockerfile.backend -t securityops-backend:ci frontend

      - name: Frontend-Image bauen
        run: docker build -f frontend/deploy/Dockerfile.frontend -t securityops-frontend:ci frontend
