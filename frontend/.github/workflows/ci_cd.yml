name: SecurityOps 2.0 CI/CD & Security Audit

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Backend Pytest & Architecture Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_DB: securityops_test
          POSTGRES_USER: secops_test_admin
          POSTGRES_PASSWORD: TestPassword123Secure!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite (Phases 2, 3, 6, 7, 8, 11)
        env:
          DATABASE_URL: postgresql+asyncpg://secops_test_admin:TestPassword123Secure!@localhost:5432/securityops_test
          SECRET_KEY: test_secret_key_hex_64_characters_minimum_security_length_token_vault
        run: |
          pytest -v tests/

  container-security-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Production Backend Container
        run: |
          docker build -t securityops-backend:latest -f deploy/Dockerfile.backend .
