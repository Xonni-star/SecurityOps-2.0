services:
  minio:
    image: ${RESTORE_TEST_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z}

  seaweedfs:
    image: ${RESTORE_TEST_S3_IMAGE:-chrislusf/seaweedfs:latest}
    entrypoint: ["weed"]
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ${RESTORE_TEST_TMPDIR:?Set RESTORE_TEST_TMPDIR}/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set test POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set test POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a test-only POSTGRES_PASSWORD}
    volumes:
      - restore_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  restore-test-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      NODE_ENV: test
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:?Set test POSTGRES_USER}:${POSTGRES_PASSWORD:?Set a test-only POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set test POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set test POSTGRES_USER}:${POSTGRES_PASSWORD:?Set a test-only POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set test POSTGRES_DB}
      JWT_SECRET: ${RESTORE_TEST_JWT_SECRET:?Set a test-only RESTORE_TEST_JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
      DMS_S3_ENDPOINT: ${DMS_S3_ENDPOINT:?Set the isolated test S3 endpoint}
      DMS_S3_REGION: ${DMS_S3_REGION:?Set the isolated test S3 region}
      DMS_S3_BUCKET: ${DMS_S3_BUCKET:?Set the isolated test S3 bucket}
      DMS_S3_ACCESS_KEY: ${DMS_S3_ACCESS_KEY:?Set test-only DMS_S3_ACCESS_KEY}
      DMS_S3_SECRET_KEY: ${DMS_S3_SECRET_KEY:?Set a test-only DMS_S3_SECRET_KEY}
      DMS_S3_FORCE_PATH_STYLE: "true"
    command: ["node", "dist/migrations/runner.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backup:
    image: ${RESTORE_TEST_BACKUP_IMAGE:-postgres:16-bookworm}
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set test POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set test POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a test-only POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set a test-only BACKUP_ENCRYPTION_KEY}
      BACKUP_ONCE: "true"
    volumes:
      - ./backup_cron.sh:/usr/local/bin/backup_cron.sh:ro
      - ${RESTORE_TEST_TMPDIR:?Set RESTORE_TEST_TMPDIR}/backups:/var/backups
    entrypoint: ["/bin/bash", "/usr/local/bin/backup_cron.sh"]

  restore-test-mc:
    image: ${RESTORE_TEST_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set test MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a test-only MINIO_ROOT_PASSWORD}
    volumes:
      - ${RESTORE_TEST_DATA_DIR:?Set RESTORE_TEST_DATA_DIR}:/test-data:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]

volumes:
  restore_test_pgdata:

networks:
  default:
    internal: true
