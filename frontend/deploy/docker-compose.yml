version: '3.8'

services:
  db:
    image: postgres:16.2-alpine
    container_name: secops_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securityops_v2
      POSTGRES_USER: secops_admin
      POSTGRES_PASSWORD: SecOpsVault2025Secure
    ports:
      - "5432:5432"
    volumes:
      - secops_dev_data:/var/lib/postgresql/data

volumes:
  secops_dev_data:
