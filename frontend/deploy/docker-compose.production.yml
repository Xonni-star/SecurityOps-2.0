# SecurityOps 2.0 - Production Docker Compose (TypeScript backend + PostgreSQL 16)
#
# Architecture:
#   proxy (Caddy, public 80/443) -> backend (Express/TS, internal 8000) -> db (PostgreSQL 16)
#   migrate (one-shot, secops_admin) -> db-init (one-shot, sets app password) -> backend
#
# Required .env values (see .env.example):
#   DOMAIN, POSTGRES_PASSWORD, POSTGRES_APP_PASSWORD, JWT_SECRET,
#   CORS_ORIGIN, BACKUP_ENCRYPTION_KEY
#
# PostgreSQL and the backend never publish host ports.

name: securityops

networks:
  secops_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SECOPS_INTERNAL_SUBNET:-172.30.0.0/24}
  secops_public:
    driver: bridge

volumes:
  secops_pgdata:
    driver: local
  secops_documents:
    driver: local
  secops_backups:
    driver: local
  caddy_data:
  caddy_config:

services:
  # Shared, ephemeral counters for the API rate limiter; accessible only on the private network.
  redis:
    image: redis:7-alpine
    container_name: secops_prod_rate_limit_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl", "--save", "", "--appendonly", "no"]
    networks:
      - secops_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  db:
    image: postgres:16-alpine
    container_name: secops_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securityops_v2}
      POSTGRES_USER: secops_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - secops_pgdata:/var/lib/postgresql/data
    networks:
      - secops_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops_admin -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # Runs DDL migrations with the administrative role. Never starts the HTTP server.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: securityops-backend:latest
    container_name: secops_prod_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: postgresql://secops_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securityops_v2}
      DATABASE_URL: postgresql://secops_app_user:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-securityops_v2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN muss gesetzt sein}
      RATE_LIMIT_REDIS_URL: redis://redis:6379
    command: ["node", "dist/migrations/runner.js"]
    networks:
      - secops_internal

  # Sets the password of the least-privilege application role after migrations.
  db-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: securityops-backend:latest
    container_name: secops_prod_dbinit
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_MIGRATION_URL: postgresql://secops_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securityops_v2}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD muss gesetzt sein}
    command: ["node", "dist/scripts/setAppPassword.js"]
    networks:
      - secops_internal

  # Initialize the private persistent file volume for the unprivileged node user.
  dms-storage-init:
    image: securityops-backend:latest
    container_name: secops_prod_dms_storage_init
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/securityops/documents && chown 1000:1000 /var/lib/securityops/documents && chmod 0700 /var/lib/securityops/documents"]
    volumes:
      - secops_documents:/var/lib/securityops/documents

  # Application backend: uses exclusively secops_app_user.
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: securityops-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      dms-storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://secops_app_user:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-securityops_v2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN muss gesetzt sein}
      TRUST_PROXY: ${TRUST_PROXY:-172.30.0.2/32}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      DMS_STORAGE_PATH: /var/lib/securityops/documents
      DMS_MAX_FILE_SIZE_BYTES: ${DMS_MAX_FILE_SIZE_BYTES:-10485760}
    volumes:
      - secops_documents:/var/lib/securityops/documents
    networks:
      - secops_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # Public TLS reverse proxy and static frontend.
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: securityops-frontend:latest
    container_name: secops_prod_proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      secops_internal:
        ipv4_address: ${SECOPS_PROXY_IPV4:-172.30.0.2}
      secops_public: {}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Encrypted PostgreSQL backups (24h interval, 30-day retention).
  backup:
    image: postgres:16-bookworm
    container_name: secops_prod_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securityops_v2}
      POSTGRES_USER: secops_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY muss gesetzt sein}
    volumes:
      - secops_backups:/var/backups
      - secops_documents:/var/lib/securityops/documents:ro
      - ./backup_cron.sh:/usr/local/bin/backup_cron.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/backup_cron.sh"]
    networks:
      - secops_internal
